<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative blue card shape -->
  <path d="M 0 100 L 700 100 C 750 100 780 130 770 180 L 650 530 C 640 580 600 610 550 610 L 0 610 Z" fill="url(#blueGradient)" opacity="0.9"/>
  
  <!-- Decorative circles -->
  <circle cx="950" cy="150" r="120" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1100" cy="500" r="180" fill="#10B981" opacity="0.08"/>
  <circle cx="850" cy="450" r="80" fill="#3B82F6" opacity="0.15"/>
  
  <!-- Logo infinity symbol -->
  <g transform="translate(80, 180)">
    <path d="M 60 40 C 60 20, 80 10, 100 20 C 120 30, 130 50, 120 70 C 110 90, 80 90, 60 70 C 40 50, 40 30, 60 20 C 80 10, 100 20, 100 40" stroke="#10B981" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 100 40 C 100 20, 120 10, 140 20 C 160 30, 170 50, 160 70 C 150 90, 120 90, 100 70 C 80 50, 80 30, 100 20 C 120 10, 140 20, 140 40" stroke="#3B82F6" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Company name -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">
    Elfetech
  </text>
  
  <!-- Tagline -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94A3B8">
    Infinite Technology. Real Insights.
  </text>
  
  <!-- Main headline -->
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">
    <tspan fill="#1e1b4b">Build.</tspan>
    <tspan fill="#1e1b4b"> Scale.</tspan>
    <tspan fill="white"> Innovate.</tspan>
  </text>
  
  <!-- Service pills -->
  <g transform="translate(80, 520)">
    <!-- AI Data Insights -->
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#3B82F6" opacity="0.2"/>
    <text x="90" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="middle">
      AI Data Insights
    </text>
    
    <!-- Cloud Consulting -->
    <rect x="200" y="0" width="180" height="40" rx="20" fill="#10B981" opacity="0.2"/>
    <text x="290" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle">
      Cloud Consulting
    </text>
    
    <!-- Dev Support -->
    <rect x="400" y="0" width="160" height="40" rx="20" fill="#6366F1" opacity="0.2"/>
    <text x="480" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#818CF8" text-anchor="middle">
      Dev Support
    </text>
  </g>
  
  <!-- Right side decorative elements - Monitor -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="300" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="160" rx="8" fill="#0f172a"/>
    <!-- Code lines -->
    <rect x="25" y="30" width="120" height="8" rx="4" fill="#3B82F6" opacity="0.6"/>
    <rect x="25" y="50" width="80" height="8" rx="4" fill="#10B981" opacity="0.5"/>
    <rect x="25" y="70" width="150" height="8" rx="4" fill="#475569" opacity="0.4"/>
    <rect x="25" y="90" width="100" height="8" rx="4" fill="#3B82F6" opacity="0.4"/>
    <rect x="25" y="110" width="60" height="8" rx="4" fill="#10B981" opacity="0.6"/>
    <rect x="25" y="130" width="130" height="8" rx="4" fill="#475569" opacity="0.3"/>
    <!-- Monitor stand -->
    <rect x="130" y="180" width="40" height="30" fill="#334155"/>
    <rect x="100" y="205" width="100" height="10" rx="5" fill="#334155"/>
  </g>
  
  <!-- Chart visualization -->
  <g transform="translate(800, 380)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Bar chart -->
    <rect x="20" y="90" width="25" height="30" rx="4" fill="#10B981"/>
    <rect x="55" y="60" width="25" height="60" rx="4" fill="#10B981"/>
    <rect x="90" y="40" width="25" height="80" rx="4" fill="#10B981"/>
    <rect x="125" y="25" width="25" height="95" rx="4" fill="#10B981"/>
    <rect x="160" y="50" width="25" height="70" rx="4" fill="#10B981"/>
  </g>
  
  <!-- URL -->
  <text x="1120" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#64748B" text-anchor="end">
    elfetech.com
  </text>
</svg>

